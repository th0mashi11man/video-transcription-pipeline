[project]
name = "video-transcription-pipeline"
version = "0.3.0"
description = "Local Whisper transcription with word confidence, PyAnnote speaker detection, and a Tauri review app"
readme = "README.md"
requires-python = ">=3.11, <3.13"
dependencies = [
    "faster-whisper>=1.2.0,<2",
    "tqdm>=4.66.0",
]

[project.optional-dependencies]
speakers = ["pyannote-audio>=4.0,<5", "torch>=2.8,<3", "torchaudio>=2.8,<3"]
dev = ["pytest>=8.0.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/video_transcription"]

[project.scripts]
transcribe = "video_transcription.pipeline:main"
download-weights = "video_transcription.weights:main"
